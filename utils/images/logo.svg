<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="A logo">
  <g fill="#1c1c1c" stroke="#1c1c1c" stroke-width="4" stroke-linejoin="round">
    <!-- A body: outer triangle with a hook-shaped counter cut out (evenodd) -->
    <path fill-rule="evenodd" d="
      M49 19 L81 80 L17 80 Z
      M49 49 L63 75 L37 75 Z
    "/>
  </g>
  <!-- Detached rounded foot along the lower-right leg -->
  <rect x="57" y="57" width="31" height="15" rx="7.5" fill="#1c1c1c"
        transform="rotate(30 72.5 64.5)"/>
</svg>
