<!DOCTYPE html>
<html lang="en" data-theme="{{ current_theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Growth</title>
    <script>
        // Hide the page until it is parsed, so it fades in once as a single
        // piece. page-fade.js reveals it on DOMContentLoaded.
        document.documentElement.classList.add('js-fade');
    </script>
    <script>
        // The signed-in account (server session) is the source of truth for whose
        // data this page loads: sync it into currentUser on every load, overriding
        // any stale value this browser kept from an earlier sign-in. With no
        // session, any cached currentUser is left as a fallback.
        (function () {
            var u = {{ current_user|tojson }};
            if (u) localStorage.setItem('currentUser', u);
        })();
    </script>
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/page-fade.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/growth.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tenor+Sans&family=Quicksand:wght@400;500;600&family=Lato:wght@300;400;700&family=Noto+Sans:wght@300;400;600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
</head>
<body class="has-topnav {{ 'dark' if current_theme == 'dark' else 'classic' }}">

    {% include 'partials/topnav.html' %}

    <!-- Theme selector (Light / Dark) -->

    <div class="growth-container">
        <div class="growth-card page-shell" id="growthCard" data-fit-shrink-height>
            <div class="card-header">
                <h1>Growth Analytics</h1>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-btn active" onclick="switchTab('cumulative')" id="cumulative-tab">Cumulative Growth</button>
                <button class="tab-btn" onclick="switchTab('daily')" id="daily-tab">Daily XP</button>
                <button class="tab-btn" onclick="switchTab('average')" id="average-tab">Average Task XP Daily</button>
                <button class="tab-btn" onclick="switchTab('cumulativeFocus')" id="cumulativeFocus-tab">Cumulative Focus</button>
                <button class="tab-btn" onclick="switchTab('dailyFocus')" id="dailyFocus-tab">Daily Focus</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Cumulative Growth Tab -->
                <div class="tab-pane active" id="cumulative-content">
                    <div class="chart-container">
                        <h2 class="chart-title">Cumulative XP Progress Over Time</h2>
                        <canvas id="growthChart"></canvas>
                    </div>
                </div>

                <!-- Daily XP Tab -->
                <div class="tab-pane" id="daily-content">
                    <div class="chart-container">
                        <h2 class="chart-title">Daily XP Earned</h2>
                        <canvas id="dailyXpChart"></canvas>
                    </div>
                </div>

                <!-- Average Task XP Tab -->
                <div class="tab-pane" id="average-content">
                    <div class="chart-container">
                        <h2 class="chart-title">Average Task XP Per Day</h2>
                        <canvas id="averageXpChart"></canvas>
                    </div>
                </div>

                <!-- Cumulative Focus Tab -->
                <div class="tab-pane" id="cumulativeFocus-content">
                    <div class="chart-container">
                        <h2 class="chart-title">Cumulative Focus Time (minutes)</h2>
                        <canvas id="cumulativeFocusChart"></canvas>
                    </div>
                </div>

                <!-- Daily Focus Tab -->
                <div class="tab-pane" id="dailyFocus-content">
                    <div class="chart-container">
                        <h2 class="chart-title">Daily Focus Time (minutes)</h2>
                        <canvas id="dailyFocusChart"></canvas>
                    </div>
                </div>
            </div>

        </div>

        <!-- Growth Ratings report card (shown via "See Growth Ratings") -->

        <!-- Floating bottom navigation bar -->
    </div>

    <script>
        // Theme is applied globally by theme.js (sourced from users.json). We only
        // need to repaint the canvas charts + sparkline when it changes, since they
        // otherwise redraw only on tab switch/resize.
        document.addEventListener('themechange', () => {
            if (typeof window.initializeChart === 'function') {
                const activeBtn = document.querySelector('#growthCard .tab-btn.active');
                const activeTab = activeBtn ? activeBtn.id.replace('-tab', '') : 'cumulative';
                // A repaint in new colours, not a fresh entrance (the false).
                window.initializeChart(activeTab, false);
            }
        });

        // Tab Switching Logic
        function switchTab(tabName) {
            // Hide all tab panes
            const panes = document.querySelectorAll('.tab-pane');
            panes.forEach(pane => {
                pane.classList.remove('active');
                // Remove fade-in class from all chart containers
                const chartContainer = pane.querySelector('.chart-container');
                if (chartContainer) {
                    chartContainer.classList.remove('fade-in');
                }
            });

            // Remove active class from all tab buttons
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => tab.classList.remove('active'));

            // Show selected tab pane
            const selectedPane = document.getElementById(tabName + '-content');
            selectedPane.classList.add('active');

            // Add active class to selected tab button
            document.getElementById(tabName + '-tab').classList.add('active');

            // Add fade-in animation to the selected chart container
            const chartContainer = selectedPane.querySelector('.chart-container');
            if (chartContainer) {
                // Trigger reflow to restart animation
                void chartContainer.offsetWidth;
                chartContainer.classList.add('fade-in');
            }

            // Size the chart to its now-visible box, then let it grow in.
            setTimeout(() => {
                initializeChart(tabName);
            }, 100);
        }

        // Initialize default chart (theme itself is handled by theme.js)
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (typeof window.initializeChart === 'function') {
                    window.initializeChart('cumulative');
                }
            }, 200);
        });

        // The two views that showRatings()/showGrowthCharts() toggled between
        // are two pages now — this one and Analytics — so the toggle is gone.
        // Navigation between them is the top bar and the link at the bottom.
    </script>

    <script src="{{ url_for('static', filename='js/growth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fit-scale.js') }}"></script>

    <script src="{{ url_for('static', filename='js/page-fade.js') }}" defer></script>
</body>
</html>
