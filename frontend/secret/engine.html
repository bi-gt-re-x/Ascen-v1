<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASCEN ENGINE</title>
    <script>
        // Sync the signed-in account into localStorage so the engine can verify
        // that the hidden chain was actually walked (the unlock is per-user/day).
        (function () {
            var u = {{ current_user|tojson }};
            if (u) localStorage.setItem('currentUser', u);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='secret/engine.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='secret/engine-settings.css') }}">
    <script src="{{ url_for('static', filename='secret/engine-settings.js') }}" defer></script>
    <script src="{{ url_for('static', filename='secret/engine.js') }}" defer></script>
</head>
<body></body>
</html>
