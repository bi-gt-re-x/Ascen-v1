<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='mainpage.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Quicksand:wght@400;500;600&family=Lato:wght@300;400;700&family=Noto+Sans:wght@300;400;600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

    <div class="calendar-container">    
        <div class="calendar-card">
            <div class="calendar-header">
                <button class="nav-arrow" onclick="changeMonth(-1)">&#10094;</button>
                <h2 id="monthYear"></h2>
                <button class="nav-arrow" onclick="changeMonth(1)">&#10095;</button>
            </div>
            <div class="calendar-grid">
                <div class="day-name">Sun</div>
                <div class="day-name">Mon</div>
                <div class="day-name">Tue</div>
                <div class="day-name">Wed</div>
                <div class="day-name">Thu</div>
                <div class="day-name">Fri</div>
                <div class="day-name">Sat</div>
            </div>
            <div class="calendar-grid" id="calendarDays"></div>
            <div class="calendar-bottom-section">
                <div class="calendar-bottom-box full-width">
                    <h3>What You'll Do Today</h3>
                    <ul id="dailyTasks"></ul>
                    <div id="taskCounter" class="task-counter"></div>
                    <button onclick="addTaskSection()" class="add-section-btn">+ Add Section</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="{{ url_for('main.home') }}" class="nav-pill">Home</a>
        <a href="{{ url_for('main.dashboard') }}" class="nav-pill">Dashboard</a>
        <a href="{{ url_for('main.growth') }}" class="nav-pill">Growth</a>
        <a href="{{ url_for('main.goals') }}" class="nav-pill">Goals</a>
    </div>

    <!-- Add Section Modal -->
    <div id="addSectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Section</h3>
                <span class="close-btn" onclick="closeAddSectionModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="timeframeName">Timeframe Name:</label>
                    <input type="text" id="timeframeName" placeholder="e.g., Morning Workout">
                </div>
                <div class="form-group">
                    <label for="startTime">Start Time:</label>
                    <div class="time-selector">
                        <select id="startHour" class="time-select"></select>
                        <select id="startMinute" class="time-select"></select>
                        <select id="startAmPm" class="time-select">
                            <option value="AM">AM</option>
                            <option value="PM">PM</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="endTime">End Time:</label>
                    <div class="time-selector">
                        <select id="endHour" class="time-select"></select>
                        <select id="endMinute" class="time-select"></select>
                        <select id="endAmPm" class="time-select">
                            <option value="AM">AM</option>
                            <option value="PM">PM</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Recurrence Type:</label>
                    <p class="recurrence-note">Recurrence applies to the next 12 months</p>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="recurrenceType" value="none" checked> No recurrence
                        </label>
                        <label>
                            <input type="radio" name="recurrenceType" value="weekly"> Days of week
                        </label>
                        <label>
                            <input type="radio" name="recurrenceType" value="monthly"> Days of month
                        </label>
                    </div>
                </div>
                <div class="form-group" id="weeklyOptions" style="display: none;">
                    <label>Select Days of Week:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="dayOfWeek" value="0"> Sunday</label>
                        <label><input type="checkbox" name="dayOfWeek" value="1"> Monday</label>
                        <label><input type="checkbox" name="dayOfWeek" value="2"> Tuesday</label>
                        <label><input type="checkbox" name="dayOfWeek" value="3"> Wednesday</label>
                        <label><input type="checkbox" name="dayOfWeek" value="4"> Thursday</label>
                        <label><input type="checkbox" name="dayOfWeek" value="5"> Friday</label>
                        <label><input type="checkbox" name="dayOfWeek" value="6"> Saturday</label>
                    </div>
                </div>
                <div class="form-group" id="monthlyOptions" style="display: none;">
                    <label>Select Days of Month:</label>
                    <div class="checkbox-group" id="monthlyDaysContainer">
                        <!-- Days will be generated by JS -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeAddSectionModal()">Cancel</button>
                <button class="btn-confirm" onclick="confirmAddSection()">Add Section</button>
            </div>
        </div>
    </div>

    <!-- Edit Section Modal -->
    <div id="editSectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Section</h3>
                <span class="close-btn" onclick="closeEditSectionModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editTimeframeName">Timeframe Name:</label>
                    <input type="text" id="editTimeframeName" placeholder="e.g., Morning Workout">
                </div>
                <div class="form-group">
                    <label for="editStartTime">Start Time:</label>
                    <div class="time-selector">
                        <select id="editStartHour" class="time-select"></select>
                        <select id="editStartMinute" class="time-select"></select>
                        <select id="editStartAmPm" class="time-select">
                            <option value="AM">AM</option>
                            <option value="PM">PM</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editEndTime">End Time:</label>
                    <div class="time-selector">
                        <select id="editEndHour" class="time-select"></select>
                        <select id="editEndMinute" class="time-select"></select>
                        <select id="editEndAmPm" class="time-select">
                            <option value="AM">AM</option>
                            <option value="PM">PM</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Recurrence Type:</label>
                    <p class="recurrence-note">Recurrence applies to the next 12 months</p>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="editRecurrenceType" value="none"> No recurrence
                        </label>
                        <label>
                            <input type="radio" name="editRecurrenceType" value="weekly"> Days of week
                        </label>
                        <label>
                            <input type="radio" name="editRecurrenceType" value="monthly"> Days of month
                        </label>
                    </div>
                </div>
                <div class="form-group" id="editWeeklyOptions" style="display: none;">
                    <label>Select Days of Week:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="editDayOfWeek" value="0"> Sunday</label>
                        <label><input type="checkbox" name="editDayOfWeek" value="1"> Monday</label>
                        <label><input type="checkbox" name="editDayOfWeek" value="2"> Tuesday</label>
                        <label><input type="checkbox" name="editDayOfWeek" value="3"> Wednesday</label>
                        <label><input type="checkbox" name="editDayOfWeek" value="4"> Thursday</label>
                        <label><input type="checkbox" name="editDayOfWeek" value="5"> Friday</label>
                        <label><input type="checkbox" name="editDayOfWeek" value="6"> Saturday</label>
                    </div>
                </div>
                <div class="form-group" id="editMonthlyOptions" style="display: none;">
                    <label>Select Days of Month:</label>
                    <div class="checkbox-group" id="editMonthlyDaysContainer">
                        <!-- Days will be generated by JS -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditSectionModal()">Cancel</button>
                <button class="btn-confirm" onclick="confirmEditSection()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="deleteModalTitle">Delete Task</h3>
                <span class="close-btn" onclick="closeDeleteModal()">&times;</span>
            </div>
            <div class="modal-body">
                <!-- Placeholder Task Delete Options -->
                <div class="form-group" id="placeholderDeleteOptions" style="display: none;">
                    <label>What would you like to delete?</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="placeholderDeleteOption" value="permanent" checked> Delete permanently
                        </label>
                        <label>
                            <input type="radio" name="placeholderDeleteOption" value="temporary"> Delete for a period
                        </label>
                        <label>
                            <input type="radio" name="placeholderDeleteOption" value="recurrences"> Delete recurrences
                        </label>
                    </div>
                </div>
                <div class="form-group" id="timePeriodOptions" style="display: none;">
                    <label>Select time period:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="timePeriod" value="1"> 1 month
                        </label>
                        <label>
                            <input type="radio" name="timePeriod" value="2"> 2 months
                        </label>
                        <label>
                            <input type="radio" name="timePeriod" value="4"> 4 months
                        </label>
                        <label>
                            <input type="radio" name="timePeriod" value="8"> 8 months
                        </label>
                        <label>
                            <input type="radio" name="timePeriod" value="12"> 12 months
                        </label>
                        <label>
                            <input type="radio" name="timePeriod" value="24"> 24 months
                        </label>
                        <label>
                            <input type="radio" name="timePeriod" value="36"> 36 months
                        </label>
                    </div>
                </div>
                <div class="form-group" id="placeholderRecurrenceOptions" style="display: none;">
                    <label>Select recurrence type to delete:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="placeholderRecurrenceType" value="dates"> Specific dates
                        </label>
                        <label>
                            <input type="radio" name="placeholderRecurrenceType" value="days"> Days of week
                        </label>
                    </div>
                </div>
                <div class="form-group" id="placeholderDatesOptions" style="display: none;">
                    <label>Select days of month to delete from:</label>
                    <div class="checkbox-group" id="placeholderDatesContainer">
                        <!-- Days 1-31 will be generated by JS -->
                    </div>
                </div>
                <div class="form-group" id="placeholderDaysOptions" style="display: none;">
                    <label>Select days of week to delete from:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="placeholderDeleteDayOfWeek" value="0"> Sunday</label>
                        <label><input type="checkbox" name="placeholderDeleteDayOfWeek" value="1"> Monday</label>
                        <label><input type="checkbox" name="placeholderDeleteDayOfWeek" value="2"> Tuesday</label>
                        <label><input type="checkbox" name="placeholderDeleteDayOfWeek" value="3"> Wednesday</label>
                        <label><input type="checkbox" name="placeholderDeleteDayOfWeek" value="4"> Thursday</label>
                        <label><input type="checkbox" name="placeholderDeleteDayOfWeek" value="5"> Friday</label>
                        <label><input type="checkbox" name="placeholderDeleteDayOfWeek" value="6"> Saturday</label>
                    </div>
                </div>

                <!-- Custom Task Delete Options -->
                <div class="form-group" id="customDeleteOptions" style="display: none;">
                    <label>What would you like to delete?</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="deleteOption" value="individual" checked> Delete individual task on this date
                        </label>
                        <label>
                            <input type="radio" name="deleteOption" value="recurrences"> Delete recurrences
                        </label>
                    </div>
                </div>
                <div class="form-group" id="recurrenceDeleteOptions" style="display: none;">
                    <label>Select recurrence type to delete:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="recurrenceDeleteType" value="dates"> Specific dates
                        </label>
                        <label>
                            <input type="radio" name="recurrenceDeleteType" value="days"> Days of week
                        </label>
                    </div>
                </div>
                <div class="form-group" id="datesDeleteOptions" style="display: none;">
                    <label>Select days of month to delete from:</label>
                    <div class="checkbox-group" id="datesDeleteContainer">
                        <!-- Days 1-31 will be generated by JS -->
                    </div>
                </div>
                <div class="form-group" id="daysDeleteOptions" style="display: none;">
                    <label>Select days of week to delete from:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="deleteDayOfWeek" value="0"> Sunday</label>
                        <label><input type="checkbox" name="deleteDayOfWeek" value="1"> Monday</label>
                        <label><input type="checkbox" name="deleteDayOfWeek" value="2"> Tuesday</label>
                        <label><input type="checkbox" name="deleteDayOfWeek" value="3"> Wednesday</label>
                        <label><input type="checkbox" name="deleteDayOfWeek" value="4"> Thursday</label>
                        <label><input type="checkbox" name="deleteDayOfWeek" value="5"> Friday</label>
                        <label><input type="checkbox" name="deleteDayOfWeek" value="6"> Saturday</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn-confirm" onclick="doneDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='javascript/calendar.js') }}"></script>
    <script src="{{ url_for('static', filename='javascript/api.js') }}"></script>

    <script>
        // Initialize the calendar once the DOM is ready
        document.addEventListener('DOMContentLoaded', initializeCalendar);
    </script>

</body>
</html>
